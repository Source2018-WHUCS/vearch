syntax = "proto3";
package proxypb;

import "github.com/gogo/protobuf/gogoproto/gogo.proto";

enum StatusCode {
    Successful = 0;
    Failed = 1;
}

message InstantQueryRequest {
    uint64 opaque = 1;
    string time = 2;
    string timeout = 3;
    string query = 4;
}

message RangeQueryRequest {
    uint64 opaque = 1;
    string start = 2;
    string end = 3;
    string step = 4;
    string timeout = 5;
    string query = 6;
}

message QueryResponse {
    uint64 opaque = 1;
    string result = 2;
    StatusCode status = 3;
    string errorMsg = 4;
}

message Label {
    string name = 1;
    string value = 2;
}

message Point {
    sint64 T = 1;
    double V = 2;
}

message Series {
    repeated Label labels = 1 [(gogoproto.nullable) = false];
    repeated Point points = 2 [(gogoproto.nullable) = false];
}

message WriteRequest {
    uint64 opaque = 1;
    repeated Series series = 2;
}

message WriteResponse {
    uint64 opaque = 1;
    StatusCode status = 2;
    string errorMsg = 3;
}