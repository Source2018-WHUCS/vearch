# Single-host cluster config (3 master + 1 router + 1 PS)
#
# Layout: all 7 processes run on 127.0.0.1 with distinct ports.
# Each process runs in its own working dir (see scripts/start_single_host_cluster.sh)
# so the relative `data` path resolves to per-process disk space.
#
# All ports are shifted +10000 from upstream defaults to dodge common service
# collisions on shared Linux hosts (8080/8081/9001/6060/2379 are very contended).
# `scripts/check_ports.sh` still re-scans these and reallocates further if any
# are occupied on the target box.
#
# Port allocation:
#   master m1   api 18817   etcd 12378  etcd_peer 12390  etcd_client 12370  pprof 16062  monitor 18828
#   master m2   api 18827   etcd 12379  etcd_peer 12391  etcd_client 12371  pprof 16072  monitor 18829
#   master m3   api 18837   etcd 12380  etcd_peer 12392  etcd_client 12372  pprof 16082  monitor 18830
#   router      http 19001  pprof 16061
#   ps1         rpc 18081   raft_hb 18898  raft_rep 18899  pprof 16060   (uses [ps] below)
#   ps2         rpc 18082   raft_hb 18900  raft_rep 18901  pprof 16063   (see config_single_host_ps2.toml)
#   ps3         rpc 18083   raft_hb 18902  raft_rep 18903  pprof 16064   (see config_single_host_ps3.toml)

[global]
    name = "vearch"
    resource_name = "default"
    # Relative path: each process resolves it against its own cwd, so the
    # 3 masters / router / ps1 each get isolated on-disk data.
    data = ["./datas"]
    log = "./logs"
    level = "info"
    signkey = "secret"
    skip_auth = false
    self_manage_etcd = false
    auto_recover_ps = true
    support_etcd_auth = false
    raft_consistent = false
    resource_limit_rate = 0.85

[etcd]
    address = ["127.0.0.1"]
    etcd_client_port = 12379
    user_name = "root"
    password = ""

# ----- Masters -----------------------------------------------------------
# Three master entries, each on 127.0.0.1 with unique ports.
# All 3 master processes load this same file; the -master=mX flag tells each
# process which entry applies to itself.

[[masters]]
    name = "m1"
    address = "127.0.0.1"
    api_port = 18817
    etcd_port = 12378
    etcd_peer_port = 12390
    etcd_client_port = 12370
    cluster_state = "new"
    pprof_port = 16062
    monitor_port = 18828

[[masters]]
    name = "m2"
    address = "127.0.0.1"
    api_port = 18827
    etcd_port = 12379
    etcd_peer_port = 12391
    etcd_client_port = 12371
    cluster_state = "new"
    pprof_port = 16072
    monitor_port = 18829

[[masters]]
    name = "m3"
    address = "127.0.0.1"
    api_port = 18837
    etcd_port = 12380
    etcd_peer_port = 12392
    etcd_client_port = 12372
    cluster_state = "new"
    pprof_port = 16082
    monitor_port = 18830

# ----- Router ------------------------------------------------------------

[router]
    port = 19001
    pprof_port = 16061
    plugin_path = "plugin"
    allow_origins = ["http://localhost", "http://127.0.0.1"]

# ----- PS (this section is for ps1; ps2/ps3 use separate files) ----------

[ps]
    rpc_port = 18081
    ps_heartbeat_timeout = 5
    raft_heartbeat_port = 18898
    raft_replicate_port = 18899
    heartbeat-interval = 200
    raft_retain_logs = 20000000
    raft_replica_concurrency = 1
    raft_snap_concurrency = 1
    raft_truncate_count = 500000
    raft_diff_count = 10000
    replica_auto_recover_time = 1800
    # 0=no anti-affinity (single host, all PSes share host_ip → anti-affinity infeasible).
    replica_anti_affinity_strategy = 0
    pprof_port = 16060
    private = false
    flush_time_interval = 600
    flush_count_threshold = 200000
